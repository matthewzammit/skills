<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b93f8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8b93f8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8b93f8" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Title -->
  <text x="64" y="92" fill="#ffffff" font-size="44" font-weight="700" letter-spacing="-0.5">Figma from code</text>
  <text x="64" y="132" fill="#a3a3a3" font-size="21">Your whole app, rebuilt in Figma from its code by Claude Code. And kept in step.</text>

  <!-- Code card -->
  <g filter="url(#shadow)">
    <rect x="64" y="184" width="380" height="372" rx="16" fill="#141414" stroke="#2a2a2a"/>
    <circle cx="90" cy="210" r="6" fill="#ff5f57"/>
    <circle cx="110" cy="210" r="6" fill="#febc2e"/>
    <circle cx="130" cy="210" r="6" fill="#28c840"/>
    <text x="160" y="215" fill="#737373" font-size="14">src/theme/tokens.ts</text>
  </g>
  <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15">
    <text x="88" y="262" fill="#c678dd">export const<tspan fill="#e5e9f0"> colors = {</tspan></text>
    <text x="108" y="292" fill="#e5e9f0">light: { bg: <tspan fill="#98c379">'#ffffff'</tspan> },</text>
    <text x="108" y="322" fill="#e5e9f0">dark:  { bg: <tspan fill="#98c379">'#0c1117'</tspan> },</text>
    <text x="88" y="352" fill="#e5e9f0">};</text>
    <text x="88" y="398" fill="#c678dd">export function<tspan fill="#61afef"> Button</tspan><tspan fill="#e5e9f0">({ look }) {</tspan></text>
    <text x="108" y="428" fill="#8a8a8a">// primary, secondary, tinted</text>
    <text x="88" y="458" fill="#e5e9f0">}</text>
    <text x="88" y="504" fill="#8a8a8a">app/         every screen and state</text>
    <text x="88" y="532" fill="#8a8a8a">components/  every shared part</text>
  </g>

  <!-- Arrow -->
  <rect x="468" y="368" width="96" height="3" fill="url(#glow)"/>
  <path d="M560 360 L576 369.5 L560 379 Z" fill="#8b93f8"/>
  <text x="516" y="350" fill="#8b93f8" font-size="14" font-weight="600" text-anchor="middle">Claude Code</text>

  <!-- Figma canvas -->
  <g filter="url(#shadow)">
    <rect x="596" y="184" width="620" height="372" rx="16" fill="#1e1e1e" stroke="#2c2c2c"/>
  </g>
  <text x="620" y="215" fill="#8c8c8c" font-size="14">Figma: Screens</text>
  <text x="1192" y="215" fill="#8c8c8c" font-size="14" text-anchor="end">Light · Dark · Empty · Error</text>

  <!-- Phone: light -->
  <g>
    <rect x="624" y="236" width="128" height="250" rx="18" fill="#ffffff"/>
    <rect x="640" y="262" width="72" height="10" rx="5" fill="#0c1117"/>
    <rect x="640" y="284" width="96" height="44" rx="10" fill="#eef1ff"/>
    <rect x="640" y="338" width="96" height="10" rx="5" fill="#d7dbe5"/>
    <rect x="640" y="356" width="80" height="10" rx="5" fill="#d7dbe5"/>
    <rect x="640" y="374" width="88" height="10" rx="5" fill="#d7dbe5"/>
    <rect x="640" y="448" width="96" height="24" rx="8" fill="#5d55f0"/>
  </g>
  <!-- Phone: dark -->
  <g>
    <rect x="768" y="236" width="128" height="250" rx="18" fill="#0c1117" stroke="#2a3140"/>
    <rect x="784" y="262" width="72" height="10" rx="5" fill="#eceff1"/>
    <rect x="784" y="284" width="96" height="44" rx="10" fill="#1a2430"/>
    <rect x="784" y="338" width="96" height="10" rx="5" fill="#273647"/>
    <rect x="784" y="356" width="80" height="10" rx="5" fill="#273647"/>
    <rect x="784" y="374" width="88" height="10" rx="5" fill="#273647"/>
    <rect x="784" y="448" width="96" height="24" rx="8" fill="#5d55f0"/>
  </g>
  <!-- Phone: empty state -->
  <g>
    <rect x="912" y="236" width="128" height="250" rx="18" fill="#0c1117" stroke="#2a3140"/>
    <rect x="928" y="262" width="72" height="10" rx="5" fill="#eceff1"/>
    <circle cx="976" cy="340" r="20" fill="none" stroke="#8b93f8" stroke-width="3"/>
    <rect x="936" y="376" width="80" height="9" rx="4.5" fill="#96a3b2"/>
    <rect x="946" y="393" width="60" height="9" rx="4.5" fill="#5e6b7a"/>
    <rect x="936" y="448" width="80" height="24" rx="8" fill="#1f2340" stroke="#8b93f8"/>
  </g>
  <!-- Design system column -->
  <g>
    <rect x="1060" y="236" width="132" height="250" rx="12" fill="#262626"/>
    <text x="1074" y="260" fill="#bdbdbd" font-size="12" font-weight="600">Design System</text>
    <rect x="1074" y="274" width="22" height="22" rx="6" fill="#5d55f0"/>
    <rect x="1102" y="274" width="22" height="22" rx="6" fill="#8b93f8"/>
    <rect x="1130" y="274" width="22" height="22" rx="6" fill="#18cc90"/>
    <rect x="1158" y="274" width="22" height="22" rx="6" fill="#e04360"/>
    <rect x="1074" y="310" width="104" height="22" rx="7" fill="#5d55f0"/>
    <rect x="1074" y="340" width="104" height="22" rx="7" fill="#3a3a3a"/>
    <rect x="1074" y="370" width="104" height="22" rx="7" fill="none" stroke="#5a5a5a"/>
    <rect x="1074" y="404" width="104" height="30" rx="8" fill="#333333"/>
    <rect x="1082" y="413" width="12" height="12" rx="3" fill="#8b93f8"/>
    <rect x="1100" y="415" width="60" height="8" rx="4" fill="#6b6b6b"/>
    <text x="1074" y="462" fill="#8c8c8c" font-size="11">Variables · Text styles</text>
    <text x="1074" y="477" fill="#8c8c8c" font-size="11">Components · Icons</text>
  </g>
  <text x="620" y="530" fill="#8c8c8c" font-size="13">Editable layers, not screenshots. Every colour a variable, every theme one switch.</text>

  <!-- Bottom strip -->
  <g font-size="17" fill="#d4d4d4">
    <circle cx="76" cy="596" r="5" fill="#8b93f8"/>
    <text x="90" y="602">Every screen and state, light and dark</text>
    <circle cx="456" cy="596" r="5" fill="#8b93f8"/>
    <text x="470" y="602">A real design system</text>
    <circle cx="700" cy="596" r="5" fill="#8b93f8"/>
    <text x="714" y="602">Weekly drift check keeps it in step</text>
  </g>
</svg>
