<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap');</style>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a3a3a3" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a3a3a3" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#a3a3a3" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="62" y="94" fill="#ffffff" font-size="50" font-weight="300" letter-spacing="-1">Dev loop audit</text>
  <text x="64" y="140" fill="#a3a3a3" font-size="21">Where last week went: CI, git hooks and Claude Code's own time, ranked by minutes.</text>

  <!-- Inputs card -->
  <g filter="url(#shadow)">
    <rect x="64" y="184" width="380" height="372" rx="16" fill="#141414" stroke="#2a2a2a"/>
    <circle cx="90" cy="210" r="6" fill="#ff5f57"/>
    <circle cx="110" cy="210" r="6" fill="#febc2e"/>
    <circle cx="130" cy="210" r="6" fill="#28c840"/>
    <text x="160" y="215" fill="#737373" font-size="14">last week, Monday to Monday</text>
  </g>
  <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15">
    <text x="88" y="262" fill="#61afef">GitHub Actions</text>
    <text x="108" y="290" fill="#8a8a8a">runs, jobs, steps, holes</text>
    <text x="108" y="316" fill="#8a8a8a">flakes, billed minutes</text>
    <text x="88" y="360" fill="#61afef">git hooks</text>
    <text x="108" y="388" fill="#8a8a8a">pre-push gate, push times</text>
    <text x="108" y="414" fill="#8a8a8a">old hooks in old worktrees</text>
    <text x="88" y="458" fill="#61afef">Claude Code transcripts</text>
    <text x="108" y="486" fill="#8a8a8a">waits, retries, refusals</text>
    <text x="108" y="512" fill="#8a8a8a">simulator and browser checks</text>
  </g>

  <!-- Arrow -->
  <rect x="468" y="368" width="96" height="3" fill="url(#glow)"/>
  <path d="M560 360 L576 369.5 L560 379 Z" fill="#a3a3a3"/>
  <text x="516" y="350" fill="#a3a3a3" font-size="14" font-weight="500" text-anchor="middle">Claude Code</text>

  <!-- Report card -->
  <g filter="url(#shadow)">
    <rect x="596" y="184" width="620" height="372" rx="16" fill="#1e1e1e" stroke="#2c2c2c"/>
  </g>
  <text x="620" y="215" fill="#8c8c8c" font-size="14">Minutes lost, week of 19 October</text>
  <text x="1192" y="215" fill="#8c8c8c" font-size="14" text-anchor="end">from GitHub and the transcripts</text>

  <g font-size="15">
    <text x="620" y="262" fill="#d4d4d4">Agent time</text>
    <rect x="760" y="249" width="360" height="16" rx="8" fill="#e5e5e5"/>
    <text x="1192" y="262" fill="#ffffff" text-anchor="end" font-weight="500">48 min</text>
    <text x="620" y="296" fill="#d4d4d4">Gate</text>
    <rect x="760" y="283" width="45" height="16" rx="8" fill="#737373"/>
    <text x="1192" y="296" fill="#d4d4d4" text-anchor="end">6 min</text>
    <text x="620" y="330" fill="#d4d4d4">CI</text>
    <rect x="760" y="317" width="30" height="16" rx="8" fill="#525252"/>
    <text x="1192" y="330" fill="#d4d4d4" text-anchor="end">4 min</text>
  </g>

  <line x1="620" y1="358" x2="1192" y2="358" stroke="#2c2c2c"/>
  <text x="620" y="388" fill="#bdbdbd" font-size="13" font-weight="600">Fixes, ranked by minutes saved a week</text>
  <g font-size="15">
    <text x="620" y="420" fill="#e5e5e5">1  A dev server script that reuses a running server</text>
    <text x="1192" y="420" fill="#a3a3a3" text-anchor="end">~20 min</text>
    <text x="620" y="450" fill="#e5e5e5">2  The pre-push hook checks dependencies first</text>
    <text x="1192" y="450" fill="#a3a3a3" text-anchor="end">~6 min</text>
    <text x="620" y="480" fill="#e5e5e5">3  Cache the browsers for the end-to-end tests</text>
    <text x="1192" y="480" fill="#a3a3a3" text-anchor="end">~1 min a run</text>
  </g>
  <text x="620" y="530" fill="#8c8c8c" font-size="13">Which should I build? Numbers, 'all' or 'none'. Nothing changes until you pick.</text>

  <!-- Bottom strip -->
  <g font-size="17" fill="#d4d4d4">
    <circle cx="76" cy="596" r="5" fill="#737373"/>
    <text x="90" y="602">CI, hooks and agent time in one list</text>
    <circle cx="428" cy="596" r="5" fill="#737373"/>
    <text x="442" y="602">Every number measured or marked estimated</text>
    <circle cx="900" cy="596" r="5" fill="#737373"/>
    <text x="914" y="602">Any time, or every Monday</text>
  </g>
</svg>
