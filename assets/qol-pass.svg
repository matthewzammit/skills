<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap');</style>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a3a3a3" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a3a3a3" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#a3a3a3" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="62" y="94" fill="#ffffff" font-size="50" font-weight="300" letter-spacing="-1">QoL pass</text>
  <text x="64" y="140" fill="#a3a3a3" font-size="21">A picky user's pass over one section of your app, with the fixes ready to pick.</text>

  <!-- Bar card -->
  <g filter="url(#shadow)">
    <rect x="64" y="184" width="380" height="372" rx="16" fill="#141414" stroke="#2a2a2a"/>
    <circle cx="90" cy="210" r="6" fill="#ff5f57"/>
    <circle cx="110" cy="210" r="6" fill="#febc2e"/>
    <circle cx="130" cy="210" r="6" fill="#28c840"/>
    <text x="160" y="215" fill="#737373" font-size="14">QUALITY.md</text>
  </g>
  <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15">
    <text x="88" y="262" fill="#61afef">## States</text>
    <text x="88" y="290" fill="#8a8a8a">- every empty state offers</text>
    <text x="108" y="314" fill="#8a8a8a">the next step</text>
    <text x="88" y="358" fill="#61afef">## Wording</text>
    <text x="88" y="386" fill="#8a8a8a">- "Sign in", never "Log in"</text>
    <text x="88" y="430" fill="#61afef">## Accessibility</text>
    <text x="88" y="458" fill="#8a8a8a">- works at the largest</text>
    <text x="108" y="482" fill="#8a8a8a">text size</text>
    <text x="88" y="512" fill="#8a8a8a">- targets 44 pt or more</text>
  </g>

  <!-- Arrow -->
  <rect x="468" y="368" width="96" height="3" fill="url(#glow)"/>
  <path d="M560 360 L576 369.5 L560 379 Z" fill="#a3a3a3"/>
  <text x="516" y="350" fill="#a3a3a3" font-size="14" font-weight="500" text-anchor="middle">Your agent</text>

  <!-- Findings card -->
  <g filter="url(#shadow)">
    <rect x="596" y="184" width="620" height="372" rx="16" fill="#1e1e1e" stroke="#2c2c2c"/>
  </g>
  <text x="620" y="215" fill="#8c8c8c" font-size="14">QoL pass: Projects</text>
  <text x="1192" y="215" fill="#8c8c8c" font-size="14" text-anchor="end">6 screens, light and dark</text>

  <g font-size="15">
    <text x="620" y="262" fill="#e5e5e5">1  Deleting the last task leaves a blank screen</text>
    <text x="1192" y="262" fill="#a3a3a3" text-anchor="end">Dead end</text>
    <text x="640" y="286" fill="#8c8c8c" font-size="13">Fix: the EmptyState with an "Add task" button</text>
    <text x="620" y="326" fill="#e5e5e5">2  Save is cut off at the largest text size</text>
    <text x="1192" y="326" fill="#a3a3a3" text-anchor="end">Layout</text>
    <text x="640" y="350" fill="#8c8c8c" font-size="13">Fix: let the footer wrap; Save stays full width</text>
    <text x="620" y="390" fill="#e5e5e5">3  The task count is one behind after a delete</text>
    <text x="1192" y="390" fill="#a3a3a3" text-anchor="end">Data</text>
    <text x="640" y="414" fill="#8c8c8c" font-size="13">Fix: refresh the count with the list</text>
    <text x="620" y="454" fill="#e5e5e5">4  "Log in" on the welcome screen</text>
    <text x="1192" y="454" fill="#a3a3a3" text-anchor="end">Wording</text>
    <text x="640" y="478" fill="#8c8c8c" font-size="13">Fix: "Sign in", as everywhere else</text>
  </g>
  <line x1="620" y1="502" x2="1192" y2="502" stroke="#2c2c2c"/>
  <text x="620" y="532" fill="#8c8c8c" font-size="13">Which should I build? Numbers, 'all' or 'none'. Nothing changes until you pick.</text>

  <!-- Bottom strip -->
  <g font-size="17" fill="#d4d4d4">
    <circle cx="76" cy="596" r="5" fill="#737373"/>
    <text x="90" y="602">Eight areas, in the running app</text>
    <circle cx="428" cy="596" r="5" fill="#737373"/>
    <text x="442" y="602">Judged against your written standards</text>
    <circle cx="900" cy="596" r="5" fill="#737373"/>
    <text x="914" y="602">Mobile and web</text>
  </g>
</svg>
