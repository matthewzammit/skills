<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap');</style>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a3a3a3" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a3a3a3" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#a3a3a3" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="62" y="94" fill="#ffffff" font-size="50" font-weight="300" letter-spacing="-1">Weekly progress note</text>
  <text x="64" y="140" fill="#a3a3a3" font-size="21">Prepares a summary of what was built, ready for your PM update.</text>

  <!-- Sources card -->
  <g filter="url(#shadow)">
    <rect x="64" y="184" width="380" height="372" rx="16" fill="#141414" stroke="#2a2a2a"/>
    <circle cx="90" cy="210" r="6" fill="#ff5f57"/>
    <circle cx="110" cy="210" r="6" fill="#febc2e"/>
    <circle cx="130" cy="210" r="6" fill="#28c840"/>
    <text x="160" y="215" fill="#737373" font-size="14">19 to 25 October</text>
  </g>
  <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15">
    <text x="88" y="262" fill="#61afef">14 merged pull requests</text>
    <text x="108" y="290" fill="#8a8a8a">git log, gh</text>
    <text x="88" y="338" fill="#61afef">2 releases</text>
    <text x="108" y="366" fill="#8a8a8a">v1.4.0, v1.4.1</text>
    <text x="88" y="414" fill="#61afef">CHANGELOG.md</text>
    <text x="108" y="442" fill="#8a8a8a">9 entries</text>
    <text x="88" y="490" fill="#61afef">last week's plan</text>
    <text x="108" y="518" fill="#8a8a8a">1 done, 1 partly, 1 not started</text>
  </g>

  <!-- Arrow -->
  <rect x="468" y="368" width="96" height="3" fill="url(#glow)"/>
  <path d="M560 360 L576 369.5 L560 379 Z" fill="#a3a3a3"/>
  <text x="516" y="350" fill="#a3a3a3" font-size="14" font-weight="500" text-anchor="middle">Your agent</text>

  <!-- Note card -->
  <g filter="url(#shadow)">
    <rect x="596" y="184" width="620" height="372" rx="16" fill="#1e1e1e" stroke="#2c2c2c"/>
  </g>
  <text x="620" y="215" fill="#8c8c8c" font-size="14">Draft, for you to edit and send</text>
  <text x="1192" y="215" fill="#8c8c8c" font-size="14" text-anchor="end">never posted for you</text>

  <g font-size="15">
    <text x="620" y="258" fill="#ffffff" font-weight="500">Weekly progress, 19 to 25 October</text>
    <text x="620" y="284" fill="#a3a3a3" font-size="14">A big week for payments: card payments shipped.</text>
    <text x="620" y="322" fill="#d4d4d4" font-weight="500">Last week</text>
    <text x="620" y="348" fill="#e5e5e5">- Card payments, with receipts by email</text>
    <text x="620" y="374" fill="#e5e5e5">- Invoices list: search and filters</text>
    <text x="620" y="400" fill="#e5e5e5">- Two releases, the second fixing a crash</text>
    <text x="620" y="438" fill="#d4d4d4" font-weight="500">This week (suggested)</text>
    <text x="620" y="464" fill="#e5e5e5">- Carried over: the invoice redesign</text>
    <text x="620" y="490" fill="#e5e5e5">- Partial refunds from the invoice page</text>
  </g>
  <line x1="620" y1="508" x2="1192" y2="508" stroke="#2c2c2c"/>
  <text x="620" y="534" fill="#8c8c8c" font-size="13">After you send it, paste it back and I will keep it for next week.</text>

  <!-- Bottom strip -->
  <g font-size="17" fill="#d4d4d4">
    <circle cx="76" cy="596" r="5" fill="#737373"/>
    <text x="90" y="602">Last week, 7 days or any dates</text>
    <circle cx="428" cy="596" r="5" fill="#737373"/>
    <text x="442" y="602">Every line traced to a merge or release</text>
    <circle cx="900" cy="596" r="5" fill="#737373"/>
    <text x="914" y="602">On demand, or every Monday</text>
  </g>
</svg>
