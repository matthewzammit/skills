<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap');</style>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a3a3a3" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a3a3a3" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#a3a3a3" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="62" y="94" fill="#ffffff" font-size="50" font-weight="300" letter-spacing="-1">Weekly audit</text>
  <text x="64" y="140" fill="#a3a3a3" font-size="21">Reviews last week's changes with the review skills you install, and gives you one checked list.</text>

  <!-- Inputs card -->
  <g filter="url(#shadow)">
    <rect x="64" y="184" width="380" height="372" rx="16" fill="#141414" stroke="#2a2a2a"/>
    <circle cx="90" cy="210" r="6" fill="#ff5f57"/>
    <circle cx="110" cy="210" r="6" fill="#febc2e"/>
    <circle cx="130" cy="210" r="6" fill="#28c840"/>
    <text x="160" y="215" fill="#737373" font-size="14">since the last run</text>
  </g>
  <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15">
    <text x="88" y="262" fill="#61afef">23 commits, 41 files</text>
    <text x="108" y="290" fill="#8a8a8a">a45c1e2..9f03b7d</text>
    <text x="88" y="338" fill="#61afef">review skills</text>
    <text x="108" y="366" fill="#8a8a8a">vibe-security</text>
    <text x="108" y="392" fill="#8a8a8a">web-design-guidelines</text>
    <text x="108" y="418" fill="#8a8a8a">better-ui</text>
    <text x="108" y="444" fill="#8a8a8a">no-ai-slop</text>
    <text x="88" y="492" fill="#61afef">last week's open tickets</text>
    <text x="108" y="520" fill="#8a8a8a">2 carried over</text>
  </g>

  <!-- Arrow -->
  <rect x="468" y="368" width="96" height="3" fill="url(#glow)"/>
  <path d="M560 360 L576 369.5 L560 379 Z" fill="#a3a3a3"/>
  <text x="516" y="350" fill="#a3a3a3" font-size="14" font-weight="500" text-anchor="middle">Your agent</text>

  <!-- Findings card -->
  <g filter="url(#shadow)">
    <rect x="596" y="184" width="620" height="372" rx="16" fill="#1e1e1e" stroke="#2c2c2c"/>
  </g>
  <text x="620" y="215" fill="#8c8c8c" font-size="14">Weekly audit, 2026-10-26</text>
  <text x="1192" y="215" fill="#8c8c8c" font-size="14" text-anchor="end">9 found, 6 checked and kept</text>

  <g font-size="15">
    <text x="620" y="262" fill="#e5e5e5">1  New /api/export/:id route has no owner check</text>
    <text x="1192" y="262" fill="#a3a3a3" text-anchor="end">High</text>
    <text x="620" y="300" fill="#e5e5e5">2  Icon-only Delete button has no label</text>
    <text x="1192" y="300" fill="#a3a3a3" text-anchor="end">Medium</text>
    <text x="640" y="324" fill="#8c8c8c" font-size="13">Draft fix ready: one-line label and a test</text>
    <text x="620" y="362" fill="#e5e5e5">3  Two ways to cancel a plan</text>
    <text x="1192" y="362" fill="#a3a3a3" text-anchor="end">Decision</text>
    <text x="640" y="386" fill="#8c8c8c" font-size="13">a. One Cancel in Settings (my pick)   b. Keep both</text>
    <text x="620" y="424" fill="#e5e5e5">4  Error toast says "Something went wrong"</text>
    <text x="1192" y="424" fill="#a3a3a3" text-anchor="end">Low</text>
    <text x="620" y="462" fill="#8c8c8c" font-size="13">3 dropped after checking the code; 2 carried over from last week</text>
  </g>
  <line x1="620" y1="502" x2="1192" y2="502" stroke="#2c2c2c"/>
  <text x="620" y="532" fill="#8c8c8c" font-size="13">1 fix ready to review, 1 needs your decision, 6 issues found.</text>

  <!-- Bottom strip -->
  <g font-size="17" fill="#d4d4d4">
    <circle cx="76" cy="596" r="5" fill="#737373"/>
    <text x="90" y="602">Only what changed since the last run</text>
    <circle cx="428" cy="596" r="5" fill="#737373"/>
    <text x="442" y="602">Every finding checked against the code</text>
    <circle cx="900" cy="596" r="5" fill="#737373"/>
    <text x="914" y="602">Fixes only if you turn them on</text>
  </g>
</svg>
