<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap');</style>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a3a3a3" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a3a3a3" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#a3a3a3" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="62" y="94" fill="#ffffff" font-size="50" font-weight="300" letter-spacing="-1">Code quality review</text>
  <text x="64" y="140" fill="#a3a3a3" font-size="21">A team of agents reads your whole app. You get small, checked pull requests.</text>

  <!-- Inputs card -->
  <g filter="url(#shadow)">
    <rect x="64" y="184" width="380" height="372" rx="16" fill="#141414" stroke="#2a2a2a"/>
    <circle cx="90" cy="210" r="6" fill="#ff5f57"/>
    <circle cx="110" cy="210" r="6" fill="#febc2e"/>
    <circle cx="130" cy="210" r="6" fill="#28c840"/>
    <text x="160" y="215" fill="#737373" font-size="14">your codebase, split into sections</text>
  </g>
  <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15">
    <text x="88" y="262" fill="#61afef">sections</text>
    <text x="108" y="290" fill="#8a8a8a">sign-in and session</text>
    <text x="108" y="316" fill="#8a8a8a">payments, offline sync</text>
    <text x="88" y="360" fill="#61afef">lenses</text>
    <text x="108" y="388" fill="#8a8a8a">bugs, security, failure modes</text>
    <text x="108" y="414" fill="#8a8a8a">implicit state machines</text>
    <text x="88" y="458" fill="#61afef">the rules you agreed</text>
    <text x="108" y="486" fill="#8a8a8a">four questions</text>
    <text x="108" y="512" fill="#8a8a8a">answered once</text>
  </g>

  <!-- Arrow -->
  <rect x="468" y="368" width="96" height="3" fill="url(#glow)"/>
  <path d="M560 360 L576 369.5 L560 379 Z" fill="#a3a3a3"/>
  <text x="516" y="350" fill="#a3a3a3" font-size="14" font-weight="500" text-anchor="middle">your agents</text>

  <!-- Report card -->
  <g filter="url(#shadow)">
    <rect x="596" y="184" width="620" height="372" rx="16" fill="#1e1e1e" stroke="#2c2c2c"/>
  </g>
  <text x="620" y="215" fill="#8c8c8c" font-size="14">Pull requests</text>
  <text x="1192" y="215" fill="#8c8c8c" font-size="14" text-anchor="end">one fix each</text>

  <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15">
    <text x="620" y="262" fill="#e5e5e5">Ignore a late reply after sign-out</text>
    <text x="1192" y="262" fill="#ffffff" text-anchor="end" font-weight="600">app: PASS</text>
    <text x="620" y="292" fill="#e5e5e5">One date helper, not three</text>
    <text x="1192" y="292" fill="#8a8a8a" text-anchor="end">reviewed</text>
    <text x="620" y="322" fill="#e5e5e5">Test the fee rounding</text>
    <text x="1192" y="322" fill="#8a8a8a" text-anchor="end">reviewed</text>
  </g>

  <line x1="620" y1="358" x2="1192" y2="358" stroke="#2c2c2c"/>
  <text x="620" y="388" fill="#bdbdbd" font-size="13" font-weight="600">Ready to merge, in three lists</text>
  <g font-size="15">
    <text x="620" y="420" fill="#e5e5e5">Nothing to see</text>
    <text x="1192" y="420" fill="#ffffff" text-anchor="end" font-weight="500">31</text>
    <text x="620" y="450" fill="#e5e5e5">Checked in the app</text>
    <text x="1192" y="450" fill="#d4d4d4" text-anchor="end">22</text>
    <text x="620" y="480" fill="#e5e5e5">Needs you</text>
    <text x="1192" y="480" fill="#d4d4d4" text-anchor="end">9</text>
    <text x="620" y="510" fill="#a3a3a3">Big items, as tickets with a plan</text>
    <text x="1192" y="510" fill="#a3a3a3" text-anchor="end">7</text>
  </g>
  <text x="620" y="540" fill="#8c8c8c" font-size="13">Nothing is built before you pick. Nothing merges without your yes.</text>

  <!-- Bottom strip -->
  <g font-size="17" fill="#d4d4d4">
    <circle cx="76" cy="596" r="5" fill="#737373"/>
    <text x="90" y="602">One survey agent per section</text>
    <circle cx="470" cy="596" r="5" fill="#737373"/>
    <text x="484" y="602">Every diff reviewed and checked</text>
    <circle cx="830" cy="596" r="5" fill="#737373"/>
    <text x="844" y="602">Merged in order, on your yes</text>
  </g>
</svg>
