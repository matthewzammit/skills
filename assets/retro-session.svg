<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap');</style>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a3a3a3" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a3a3a3" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#a3a3a3" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="62" y="94" fill="#ffffff" font-size="50" font-weight="300" letter-spacing="-1">Session retro</text>
  <text x="64" y="140" fill="#a3a3a3" font-size="21">Makes your agent's next session go better than the last.</text>

  <!-- Inputs card -->
  <g filter="url(#shadow)">
    <rect x="64" y="184" width="380" height="372" rx="16" fill="#141414" stroke="#2a2a2a"/>
    <circle cx="90" cy="210" r="6" fill="#ff5f57"/>
    <circle cx="110" cy="210" r="6" fill="#febc2e"/>
    <circle cx="130" cy="210" r="6" fill="#28c840"/>
    <text x="160" y="215" fill="#737373" font-size="14">one session, since the last retro</text>
  </g>
  <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15">
    <text x="88" y="262" fill="#61afef">the transcript</text>
    <text x="108" y="290" fill="#8a8a8a">hidden failures, errors</text>
    <text x="108" y="316" fill="#8a8a8a">hooks and denials, repeats</text>
    <text x="88" y="360" fill="#61afef">your messages</text>
    <text x="108" y="388" fill="#8a8a8a">"no, I said..."</text>
    <text x="108" y="414" fill="#8a8a8a">rules said again</text>
    <text x="88" y="458" fill="#61afef">earlier retros</text>
    <text x="108" y="486" fill="#8a8a8a">fixes: held or broke</text>
    <text x="108" y="512" fill="#8a8a8a">problems that came back</text>
  </g>

  <!-- Arrow -->
  <rect x="468" y="368" width="96" height="3" fill="url(#glow)"/>
  <path d="M560 360 L576 369.5 L560 379 Z" fill="#a3a3a3"/>
  <text x="516" y="350" fill="#a3a3a3" font-size="14" font-weight="500" text-anchor="middle">Claude Code</text>

  <!-- Report card -->
  <g filter="url(#shadow)">
    <rect x="596" y="184" width="620" height="372" rx="16" fill="#1e1e1e" stroke="#2c2c2c"/>
  </g>
  <text x="620" y="215" fill="#8c8c8c" font-size="14">Findings, ranked by cost</text>
  <text x="1192" y="215" fill="#8c8c8c" font-size="14" text-anchor="end">each with one line of proof</text>

  <g font-size="15">
    <text x="620" y="262" fill="#e5e5e5">1  Searches that never ran (a shell glob)</text>
    <text x="1192" y="262" fill="#ffffff" text-anchor="end" font-weight="500">262 times</text>
    <text x="620" y="296" fill="#e5e5e5">2  A hook that fired on finished work</text>
    <text x="1192" y="296" fill="#d4d4d4" text-anchor="end">5 turns</text>
    <text x="620" y="330" fill="#e5e5e5">3  A hand-written edit that emptied files</text>
    <text x="1192" y="330" fill="#d4d4d4" text-anchor="end">4 files</text>
  </g>

  <line x1="620" y1="358" x2="1192" y2="358" stroke="#2c2c2c"/>
  <text x="620" y="388" fill="#bdbdbd" font-size="13" font-weight="600">Repeat of an earlier retro</text>
  <g font-size="15">
    <text x="620" y="420" fill="#e5e5e5">The same hook was fixed twice before.</text>
    <text x="620" y="450" fill="#a3a3a3">Fix the cause: test the hook with real ticket ids.</text>
  </g>
  <text x="620" y="530" fill="#8c8c8c" font-size="13">Which should I build? Nothing changes until you pick.</text>

  <!-- Bottom strip -->
  <g font-size="17" fill="#d4d4d4">
    <circle cx="76" cy="596" r="5" fill="#737373"/>
    <text x="90" y="602">Finds what a quick read misses</text>
    <circle cx="428" cy="596" r="5" fill="#737373"/>
    <text x="442" y="602">Fixes go in checks, hooks and scripts</text>
    <circle cx="900" cy="596" r="5" fill="#737373"/>
    <text x="914" y="602">A record of every retro</text>
  </g>
</svg>
